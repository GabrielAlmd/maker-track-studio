name: Bug report
description: Report a reproducible problem
body:
  - type: markdown
    attributes:
      value: >-
        Do not include databases, backups, credentials, private keys or personal
        information. For security vulnerabilities, use SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: Distribution
      options:
        - Desktop Windows
        - Desktop Linux
        - Self-Hosted ARM64
        - Self-Hosted AMD64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include synthetic examples only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and sanitized logs
      description: Include OS, architecture and relevant runtime versions.
