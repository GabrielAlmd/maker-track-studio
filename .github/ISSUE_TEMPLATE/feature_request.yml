name: Feature request
description: Suggest an improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: Affected distribution
      multiple: true
      options:
        - Desktop
        - Self-Hosted
        - Both
