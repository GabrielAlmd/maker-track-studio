name: Browser Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lan-proxy-security:
    name: LAN - real HTTPS proxy security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
      - name: Install Nginx for proxy integration tests
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Build self-hosted helper
        working-directory: apps/api
        run: go build -o "${{ runner.temp }}/maker-selfhostctl" ./cmd/selfhostctl
      - name: Build standalone API
        working-directory: apps/api
        run: go build -o "${{ runner.temp }}/maker-track-api" ./cmd/server
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: web-frontend
          path: apps/web/dist
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/web/package-lock.json') }}
      - name: Install browser test dependencies
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install-deps chromium
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: npx playwright install chromium
      - name: Test proxy configuration and browser against disposable SQLite API
        run: python3 scripts/test_lan_proxy.py --nginx /usr/sbin/nginx --helper "${{ runner.temp }}/maker-selfhostctl" --api "${{ runner.temp }}/maker-track-api" --web-root apps/web/dist --browser

  frontend-visual:
    name: Frontend - visual catalogue
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/web/package-lock.json') }}
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: web-frontend
          path: apps/web/dist
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Test visual catalogue using the shared frontend
        env:
          MAKER_TRACK_PREBUILT_WEB: '1'
        run: npm run screenshots:check
      - name: Upload visual differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-visual-differences
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify curated screenshots are current
        working-directory: .
        run: |
          git diff --exit-code -- docs/screenshots
          test -z "$(git status --porcelain --untracked-files=all -- docs/screenshots)"
